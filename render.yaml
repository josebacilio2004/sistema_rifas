services:
  - type: web
    name: rifa-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: rifa-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://YOUR_GITHUB_USERNAME.github.io/Rifa
      - key: N8N_WEBHOOK_URL
        value: https://your-n8n-instance.com/webhook/rifa
      - key: YAPE_PHONE
        value: +51987654321
      - key: YAPE_NAME
        value: Sistema de Rifas
    healthCheckPath: /health

databases:
  - name: rifa-db
    plan: free
    databaseName: rifa_db
    user: rifauser
